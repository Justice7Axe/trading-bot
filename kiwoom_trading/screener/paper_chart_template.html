<title>모의투자 타점 차트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#18202e; --muted:#5f6b7d; --line:#dbe0e8; --grid:#eef1f5;
  --up:#d33a3a; --down:#2f63cf; --buy:#0e8f6e; --sell:#7b3fc4; --signal:#a07a12; --stop:#d33a3a;
  --sel:#e9eef8; --chip:#eef1f5;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141b; --panel:#171c25; --ink:#e6eaf1; --muted:#97a2b3; --line:#2a3240; --grid:#1f2631;
    --up:#f0605d; --down:#5b8df0; --buy:#34c49a; --sell:#b183ef; --signal:#d9ae3f; --stop:#f0605d;
    --sel:#222b3a; --chip:#1f2631;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141b; --panel:#171c25; --ink:#e6eaf1; --muted:#97a2b3; --line:#2a3240; --grid:#1f2631;
  --up:#f0605d; --down:#5b8df0; --buy:#34c49a; --sell:#b183ef; --signal:#d9ae3f; --stop:#f0605d;
  --sel:#222b3a; --chip:#1f2631;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-variant-numeric:tabular-nums}
.stat{display:grid;gap:0}
.stat > b{font-family:var(--mono);font-size:17px;font-weight:500}
.stat > span{color:var(--muted);font-size:12px}
.pos{color:var(--up)} .neg{color:var(--down)}
.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.list{display:grid;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
@media (max-width:820px){.list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;padding:8px 10px;border-radius:6px}
.row:hover{background:var(--chip)}
.row:focus-visible{outline:2px solid var(--buy);outline-offset:-2px}
.row[aria-selected="true"]{background:var(--sel)}
.row .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.row .k{grid-column:2 / 4;font-size:12px;color:var(--muted)}
.row .f{grid-column:2 / 4;font-size:11.5px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.ptitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ptitle h2{font-size:18px;margin:0}
.ptitle .code{font-family:var(--mono);color:var(--muted);font-size:13px}
#chart{height:440px;width:100%}
@media (max-width:520px){#chart{height:340px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin:0}
dl div{display:grid}
dt{color:var(--muted);font-size:12px}
dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.flow{display:grid;gap:6px;padding:10px 12px;border-radius:6px;background:var(--chip)}
.flow dl{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.flow h3{margin:0;font-size:13px;font-weight:500}
.flow h3 span{color:var(--muted);font-weight:400;font-size:12px}
.hot{color:var(--up);font-weight:500}
.note{color:var(--muted);font-size:12px;margin:0}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="h">모의투자 타점 차트</h1>
      <p class="sub">1분봉 위에 신호·매수·매도 지점과 손절선을 표시합니다. 빨강은 오른 봉, 파랑은 내린 봉입니다.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="main">
    <div class="list" id="list" role="tablist" aria-label="매매 목록"></div>
    <section class="panel" aria-live="polite">
      <div class="ptitle"><h2 id="pname"></h2><span class="code" id="pcode"></span><span id="ptags"></span></div>
      <div id="chart"></div>
      <div class="legend">
        <span><i style="background:var(--signal)"></i>신호 봉</span>
        <span><i style="background:var(--buy)"></i>매수 ▲</span>
        <span><i style="background:var(--sell)"></i>매도 ▼</span>
        <span><i style="background:var(--stop)"></i>손절선(점선)</span>
        <span><i style="background:var(--muted)"></i>아래 막대: 1분 거래대금</span>
        <span>휠·드래그로 확대·이동, 두 번 누르면 매매 구간으로 돌아갑니다.</span>
      </div>
      <div class="flow">
        <h3>매수 시점 거래대금 <span id="fbasis"></span></h3>
        <dl id="flow"></dl>
      </div>
      <dl id="detail"></dl>
      <p class="note" id="pnote"></p>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const DATA = /*__DATA__*/null;
const won = x => x == null ? "–" : Math.round(x).toLocaleString("ko-KR");
const pct = x => x == null ? "–" : (x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "%";
const sign = x => x == null ? "" : x > 0 ? "pos" : x < 0 ? "neg" : "";
const hm = s => { const d = new Date(s * 1000); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); };
const eok = x => x == null ? "–" : (x >= 1e10 ? Math.round(x / 1e8).toLocaleString("ko-KR") : (x / 1e8).toFixed(1)) + "억";
const times = x => x == null ? "–" : x.toFixed(1) + "배";
const rankText = f => !f ? "–" : f.rank ? f.rank + "위" : "200위 밖";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const trades = DATA.trades;
const day = DATA.date;
document.getElementById("h").textContent = day.slice(5).replace("-", "월 ") + "일 모의투자 타점";

// 요약
(function () {
  const done = trades.filter(t => t.pnl != null);
  const real = done.filter(t => !t.virtual), virt = done.filter(t => t.virtual);
  const sum = xs => xs.reduce((a, t) => a + t.pnl, 0);
  const wins = done.filter(t => t.pnl > 0).length;
  const items = [];
  if (DATA.asset && DATA.asset[0] && DATA.asset[1]) {
    const d = DATA.asset[1] - DATA.asset[0];
    items.push([`<span class="${sign(d)}">${d >= 0 ? "+" : ""}${won(d)}원</span>`, `계좌 (${pct(DATA.asset[1] / DATA.asset[0] - 1)})`]);
  }
  items.push([`${done.length}건`, `매매 · 이긴 매매 ${wins}건`]);
  items.push([`<span class="${sign(sum(real))}">${won(sum(real))}원</span>`, `정규장 주문 ${real.length}건`]);
  items.push([`<span class="${sign(sum(virt))}">${won(sum(virt))}원</span>`, `애프터장 가상 ${virt.length}건`]);
  document.getElementById("stats").innerHTML = items.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
})();

// 목록
const list = document.getElementById("list");
trades.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "row"; b.id = "trade-" + i; b.setAttribute("role", "tab");
  b.innerHTML = `<span class="t">${hm(t.buy[0])}</span><span class="n">${t.name}</span>`
    + `<span class="r ${sign(t.ret)}">${pct(t.ret)}</span>`
    + `<span class="k">${t.kind}${t.virtual ? '<span class="tag">가상</span>' : ""}${t.mode === "추적" ? '<span class="tag">추적</span>' : ""}</span>`
    + (t.flow ? `<span class="f">대금 ${rankText(t.flow)} · ${t.flow.x_usual != null ? "평소 " + times(t.flow.x_usual) : "직전 " + times(t.flow.x_prev)}</span>` : "");
  b.addEventListener("click", () => select(i));
  list.appendChild(b);
});

// 차트
const el = document.getElementById("chart");
let chart, series, vseries, lines = [], current = 0;

function theme() {
  return {
    layout: { background: { type: "solid", color: css("--panel") }, textColor: css("--muted"), fontFamily: css("--mono"), fontSize: 11 },
    grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
    rightPriceScale: { borderColor: css("--line") },
    timeScale: { borderColor: css("--line"), timeVisible: true, secondsVisible: false, rightOffset: 8 },
    crosshair: { mode: 0 },
    localization: { locale: "ko-KR", priceFormatter: p => Math.round(p).toLocaleString("ko-KR") },
  };
}
function build() {
  if (chart) chart.remove();
  chart = LightweightCharts.createChart(el, { ...theme(), autoSize: true });
  series = chart.addCandlestickSeries({
    upColor: css("--up"), downColor: css("--down"), borderUpColor: css("--up"), borderDownColor: css("--down"),
    wickUpColor: css("--up"), wickDownColor: css("--down"), priceLineVisible: false,
  });
  series.priceScale().applyOptions({ scaleMargins: { top: 0.06, bottom: 0.24 } });
  vseries = chart.addHistogramSeries({ priceScaleId: "value", priceLineVisible: false, lastValueVisible: false,
    priceFormat: { type: "custom", formatter: v => eok(v) } });
  chart.priceScale("value").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  el.addEventListener("dblclick", fit);
}
function fit() {
  const t = trades[current];
  const from = Math.min(t.buy[0], t.signal ? t.signal[0] : t.buy[0]) - 40 * 60;
  const to = (t.sell ? t.sell[0] : t.buy[0]) + 40 * 60;
  chart.timeScale().setVisibleRange({ from, to });
}
function select(i) {
  current = i;
  const t = trades[i];
  list.querySelectorAll(".row").forEach((r, k) => r.setAttribute("aria-selected", k === i ? "true" : "false"));
  document.getElementById("pname").textContent = t.name;
  document.getElementById("pcode").textContent = t.code;
  document.getElementById("ptags").innerHTML = `<span class="tag">${t.kind}</span><span class="tag">${t.virtual ? "애프터장 가상 체결" : "정규장 모의 주문"}</span>`
    + (t.mode === "추적" ? '<span class="tag">추적 방식</span>' : "");
  const rows = DATA.candles[t.code] || [];
  series.setData(rows.map(r => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] })));
  const up = css("--up"), down = css("--down");
  vseries.setData(rows.map(r => ({ time: r[0], value: r[4] * r[5], color: (r[4] >= r[1] ? up : down) + "88" })));
  lines.forEach(l => series.removePriceLine(l)); lines = [];
  const markers = [];
  if (t.signal) markers.push({ time: t.signal[0], position: "aboveBar", color: css("--signal"), shape: "circle", text: "신호" });
  markers.push({ time: t.buy[0] - t.buy[0] % 60, position: "belowBar", color: css("--buy"), shape: "arrowUp", text: "매수 " + won(t.buy[1]) });
  if (t.sell) markers.push({ time: t.sell[0] - t.sell[0] % 60, position: "aboveBar", color: css("--sell"), shape: "arrowDown", text: "매도 " + won(t.sell[1]) });
  markers.sort((a, b) => a.time - b.time);
  series.setMarkers(markers);
  lines.push(series.createPriceLine({ price: t.buy[1], color: css("--buy"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "매수가" }));
  if (t.stop) lines.push(series.createPriceLine({ price: t.stop, color: css("--stop"), lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "손절" }));
  if (t.sell) lines.push(series.createPriceLine({ price: t.sell[1], color: css("--sell"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "매도가" }));
  if (rows.length) fit();
  const held = t.sell ? Math.round((t.sell[0] - t.buy[0]) / 60) : null;
  const d = [
    ["신호", t.signal ? `${hm(t.signal[0])} · ${won(t.signal[1])}` : "–"],
    ["매수", `${hm(t.buy[0])} · ${won(t.buy[1])} × ${t.qty}주`],
    ["매도", t.sell ? `${hm(t.sell[0])} · ${won(t.sell[1])}` : t.status],
    ["손절가", t.stop ? `${won(t.stop)} (${pct(t.stop / t.buy[1] - 1)})` : "–"],
    ["보유", held != null ? `${held}분` : "–"],
    ["수익률 (비용 0.25% 포함)", `<span class="${sign(t.ret)}">${pct(t.ret)}</span>`],
    ["손익", `<span class="${sign(t.pnl)}">${won(t.pnl)}원</span>`],
    ["매도 사유", t.reason || "–"],
  ];
  const f = t.flow;
  document.getElementById("fbasis").textContent = f ? (f.basis === "AL" ? "· 순위·누적은 KRX, 5분 대금은 통합(NXT 포함) 1분봉" : "· KRX 기준") : "";
  const hot = x => x != null && x >= 3 ? ` class="hot"` : "";
  document.getElementById("flow").innerHTML = !f ? "<div><dd>–</dd></div>" : [
    ["대금 순위 (KRX 누적)", rankText(f)],
    ["누적 거래대금", eok(f.cum) + (f.al_cum ? ` <span class="note">(통합 ${eok(f.al_cum)})</span>` : "")],
    ["최근 5분 대금", eok(f.v5)],
    ["가속도 · 평소 대비", `<span${hot(f.x_usual)}>${times(f.x_usual)}</span>`],
    ["가속도 · 직전 5분 대비", `<span${hot(f.x_prev)}>${times(f.x_prev)}</span>`],
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  document.getElementById("detail").innerHTML = d.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  document.getElementById("pnote").textContent = (rows.length ? "" : "이 종목은 저장된 1분봉이 없습니다. ")
    + (t.source ? "포착 경로: " + t.source : "");
}

if (!trades.length) {
  document.querySelector(".main").innerHTML = '<p class="empty">이날은 모의투자 매매 기록이 없습니다.</p>';
} else {
  build(); select(0);
  const rerender = () => { build(); select(current); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender); } catch (e) {}
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
</script>
